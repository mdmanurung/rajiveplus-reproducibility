# Pinned analysis-package dependency for the paper workflow.
#
# The workflow installs the package from the submodule checkout
# (`rajiveplus/`) at exactly this commit, then runs against it. Re-pin to the
# master merge commit after PR #9 is merged, and tag the release commit.
package:
  repo: https://github.com/mdmanurung/rajiveplus.git
  commit: 99fd4e3ed83226d7fd9f87afdb0ba5bc012c9c1e
  ref_at_pin_time: refs/heads/miss-data-handling  # PR #9 head (unmerged at pin time)
  version: 0.1.0
  method_profile: RJP-BASE v2 (default_orthonormal_constrained)
  install: R CMD build rajiveplus && R CMD INSTALL rajiveplus_0.1.0.tar.gz
  notes: >
    The commit is the authoritative pin; the tarball is built from the
    submodule checkout so its SHA256 is recorded per-build in the run
    receipt rather than pre-pinned here (R CMD build output embeds
    timestamps and is not byte-reproducible across builds).
